ServerName carlosburgosh.com
<VirtualHost *:80>
 ServerName carlosburgosh.com
 ServerAlias www.carlosburgosh.com
 DocumentRoot /srv/carlos/public
</VirtualHost>
<VirtualHost *:443>
 ServerName carlosburgosh.com
 ServerAlias www.carlosburgosh.com
 DocumentRoot /srv/carlos/public
 SSLEngine on
 SSLCertificateFile /tmp/test.crt
 SSLCertificateKeyFile /tmp/test.key
</VirtualHost>
<Directory /srv/carlos>
 Require all denied
</Directory>
<Directory /srv/carlos/public>
 AllowOverride All
 Require all granted
</Directory>
