name: carlosburgos

# Local development only. Database credentials below are not CMS credentials.
x-api: &api-base
  build:
    context: .
    dockerfile: docker/php.Dockerfile
  environment: &api-env
    CB_ENVIRONMENT: local
    CB_DB_HOST: db
    CB_DB_PORT: "3306"
    CB_DB_NAME: carlosburgos
    CB_DB_USER: carlosburgos
    CB_DB_PASSWORD: ${CB_DB_PASSWORD:-cb_local_dev_only}
  working_dir: /app
  volumes:
    - ./api:/app/api:ro
    - ./database:/app/database:ro
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: carlosburgos
      MARIADB_USER: carlosburgos
      MARIADB_PASSWORD: ${CB_DB_PASSWORD:-cb_local_dev_only}
      MARIADB_ROOT_PASSWORD: ${CB_DB_ROOT_PASSWORD:-cb_local_root_dev_only}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  migrate:
    <<: *api-base
    command: ["php", "api/bin/console.php", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-base
    volumes:
      - ./api:/app/api:ro
      - ./database:/app/database:ro
      - api_storage:/app/api/storage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/api/public/settings') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  web:
    image: node:22-alpine
    working_dir: /app/web
    init: true
    environment:
      CB_API_TARGET: http://api:8080
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app/web
      - web_dependencies:/app/web/node_modules
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"]
    ports:
      - "127.0.0.1:${CB_WEB_PORT:-5180}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  db_data:
  api_storage:
  web_dependencies:
